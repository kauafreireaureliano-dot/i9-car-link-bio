<!doctype html>
<html lang="pt-BR">
<head>

  <title>Jeep Compass 2022 | i9 Car Multimarcas</title>

    :root{color-scheme:dark;--bg:#101010;--panel:#1c1c1c;--orange:#ff7417;--white:#f8f8f8;--muted:#bdbdbd;--green:#20c765}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% -10%,#3b2417 0,transparent 46%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif}

    .eyebrow{margin:0 0 10px;color:var(--orange);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
    h1{margin:0 0 14px;font-size:clamp(27px,7vw,36px);line-height:1.12}
    p{margin:0 auto 24px;max-width:340px;color:var(--muted);font-size:16px;line-height:1.55}
    .whatsapp{display:flex;align-items:center;justify-content:center;min-height:56px;padding:15px 18px;border-radius:12px;background:var(--green);color:#062b16;text-decoration:none;font-size:17px;font-weight:800;transition:filter .15s,transform .15s}
    .whatsapp:hover{filter:brightness(1.08);transform:translateY(-1px)}
    footer{margin-top:22px;color:#888;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="https://i.imgur.com/mEMpI7v.png" alt="i9 Car Multimarcas">

</body>
