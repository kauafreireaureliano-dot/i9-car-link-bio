<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Encontre seu próximo carro na i9 Car Multimarcas. Fale com nossos consultores e conheça nosso estoque.">
  <title>i9 Car Multimarcas | Fale com a gente</title>
  <style>
    :root{--bg:#101010;--panel:#1b1b1b;--panel2:#242424;--orange:#ff7417;--white:#f8f8f8;--muted:#b9b9b9}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,#3b2417 0,transparent 42%),var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:28px 16px 40px}
    .wrap{width:100%;max-width:480px}
    header{text-align:center;padding:12px 8px 22px}
    .logo{display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
    .logo img{display:block;width:min(190px,62%);height:auto;max-height:150px;object-fit:contain}
    .section-label{font-size:17px;letter-spacing:2.4px;text-transform:uppercase;color:var(--orange);font-weight:900;margin:18px 4px 13px;text-align:center}
    .consultants{display:flex;flex-direction:column;gap:12px}
    .consultant-card{display:flex;align-items:center;gap:15px;width:100%;min-height:104px;padding:14px 17px;background:linear-gradient(110deg,#292929,#181818);border:1px solid #414141;border-left:4px solid var(--orange);border-radius:15px;text-decoration:none;color:var(--white);text-align:left;transition:transform .15s,border-color .15s,filter .15s}
    .consultant-card:hover{transform:translateY(-2px);border-color:var(--orange);filter:brightness(1.08)}
    .avatar{flex:0 0 68px;width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid var(--orange);background:#343434}
    .avatar img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
    .consultant-info{display:flex;flex:1;flex-direction:column;gap:5px;min-width:0}
    .consultant-info strong{font-size:18px;line-height:1.1}
    .consultant-info small{color:var(--muted);font-size:12px}
    .consultant-hint{font-size:12px;font-weight:800;color:var(--orange);margin-top:3px}
    .card-arrow{font-size:25px;color:var(--orange);font-weight:700;padding-left:4px}
    a.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:14px;border-radius:12px;text-decoration:none;font-weight:900;font-size:16px;transition:transform .15s,filter .15s}
    a.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .catalog{margin-top:14px;background:#f5f5f5;color:#111;font-size:17px;letter-spacing:.5px}
    .catalog span{color:var(--orange)}
    @media(max-width:360px){.section-label{font-size:16px}.consultant-card{gap:11px;padding:12px}.avatar{flex-basis:58px;width:58px;height:58px}.consultant-info strong{font-size:16px}.consultant-hint{font-size:11px}}
    .bottom{margin-top:20px}
    .bottom .btn{background:var(--orange);color:#111;min-height:54px;font-size:15px}
    footer{text-align:center;color:#777;font-size:11px;margin-top:22px;line-height:1.6}
    .pin{color:var(--orange)}
    @media(max-width:360px){h1{font-size:20px}.consultants{grid-template-columns:1fr}.consultant{padding:13px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo"><img src="https://i.imgur.com/mEMpI7v.png" alt="i9 Car Multimarcas"></div>
    </header>

    <div class="section-label">Nossos consultores</div>
    <section class="consultants" aria-label="Fale com nossos consultores">
      <a class="consultant-card" href="https://wa.me/558791732345?text=Ol%C3%A1%2C%20vim%20do%20Instagram%20e%20queria%20saber%20mais" target="_blank" rel="noopener" aria-label="Falar com Arison pelo WhatsApp">
        <div class="avatar"><img src="https://i.imgur.com/Xa6K21Y.png" alt="Foto de Arison"></div>
        <span class="consultant-info"><strong>Arison</strong><small>Consultor de vendas</small><span class="consultant-hint">Falar pelo WhatsApp</span></span>
        <span class="card-arrow" aria-hidden="true">›</span>
      </a>
      <a class="consultant-card" href="https://wa.me/5587991967122?text=Ol%C3%A1%2C%20vim%20do%20Instagram%20e%20queria%20saber%20mais" target="_blank" rel="noopener" aria-label="Falar com Kauã pelo WhatsApp">
        <div class="avatar"><img src="https://i.imgur.com/mi5PBMi.png" alt="Foto de Kauã"></div>
        <span class="consultant-info"><strong>Kauã</strong><small>Consultor de vendas</small><span class="consultant-hint">Falar pelo WhatsApp</span></span>
        <span class="card-arrow" aria-hidden="true">›</span>
      </a>
    </section>

    <a class="btn catalog" href="https://wa.me/558791732345?text=Ol%C3%A1%2C%20vim%20do%20Instagram%20e%20quero%20ver%20os%20ve%C3%ADculos%20dispon%C3%ADveis" target="_blank" rel="noopener"><span>▣</span> DISPONÍVEIS ✅</a>

    <div class="bottom">
      <a class="btn" href="https://wa.me/558791732345?text=Ol%C3%A1%2C%20vim%20do%20Instagram%20e%20queria%20saber%20mais" target="_blank" rel="noopener">FALAR COM UM CONSULTOR <span>→</span></a>
    </div>
    <footer><span class="pin">●</span> i9 Car Multimarcas<br>Atendimento próximo, transparência e boas oportunidades.</footer>
  </main>
</body>
</html>
